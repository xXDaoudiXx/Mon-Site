<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>xXDaoudiXx - Smartphone Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
        margin: 0; color: white; font-family: 'Segoe UI', sans-serif;
        background-color: #050505; overflow-x: hidden; -webkit-font-smoothing: antialiased;
    }
    #bg-wrapper {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
        background: linear-gradient(rgba(0, 0, 0, 0.10), rgba(0, 0, 0, 0.95)), 
                    url('images/background.jpg') center center / cover no-repeat;
    }
    #particles-js { position: absolute; width: 100%; height: 100%; filter: drop-shadow(0 0 8px #00d2ff); }
    .neon-blue {
      color: #fff; text-shadow: 0 0 5px #fff, 0 0 15px #00d2ff, 0 0 30px rgba(0, 210, 255, 0.6);
      font-style: italic; font-weight: 900; text-transform: uppercase;
    }
    .perspective-container { perspective: 1200px; width: 100%; max-width: 250px; margin: 0 auto 40px auto; }
    .smartphone-container {
        position: relative; width: 100%; transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        transform-style: preserve-3d; cursor: pointer;
    }
    .tilt-left { transform: rotateY(-15deg) rotateX(5deg); }
    .tilt-right { transform: rotateY(15deg) rotateX(5deg); }
    .perspective-container:hover .smartphone-container { transform: rotateY(0deg) rotateX(0deg) scale(1.02); }
    .img-wrapper { display: grid; grid-template-columns: 1fr; width: 100%; }
    .phone-img { grid-area: 1 / 1; width: 100%; height: auto; display: block; transition: opacity 0.4s ease; filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6)); }
    .phone-img-face { opacity: 0; }
    .phone-img-profil { opacity: 1; }
    .perspective-container:hover .phone-img-face { opacity: 1; }
    .perspective-container:hover .phone-img-profil { opacity: 0; }
    .phone-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding: 70px 30px;
        display: flex; flex-direction: column; align-items: center; justify-content: space-between;
        z-index: 10; transform: translateZ(40px); 
    }
    .btn-download {
        background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.3); padding: 8px; width: 80%; border-radius: 12px;
        font-weight: 900; text-transform: uppercase; transition: 0.3s; text-align: center; color: white;
    }
    .btn-download:hover { background: #050505; border-color: #00d2ff; box-shadow: 0 0 15px #00d2ff; }
    .back-btn { background: #050505; border: 1px solid #444; padding: 8px 20px; border-radius: 50px; font-weight: bold; transition: 0.3s; color: white; }
    .back-btn:hover { border-color: #00d2ff; box-shadow: 0 0 15px #00d2ff; color: #00d2ff; }
  </style>
</head>
<body class="flex flex-col min-h-screen">
  <div id="bg-wrapper"><div id="particles-js"></div></div>

  <nav class="p-6 relative z-10 flex justify-between items-center max-w-6xl mx-auto w-full">
    <a href="index.html" class="back-btn">← ACCUEIL</a>
    <h1 class="text-2xl neon-blue"></h1>
  </nav>

  <main class="flex-grow p-6 relative z-10 max-w-6xl mx-auto w-full text-center">
    <header class="mb-12">
        <h2 class="text-6xl neon-blue">𝐀𝐧𝐝𝐫𝐨𝐢𝐝 & 𝐈𝐎𝐒</h2>
        <p class="text-gray-300 text-lg mt-4 max-w-2xl mx-auto font-medium opacity-80 italic">
            𝐒𝐞́𝐥𝐞𝐜𝐭𝐢𝐨𝐧𝐧𝐞𝐳 𝐯𝐨𝐭𝐫𝐞 𝐩𝐥𝐚𝐭𝐞𝐟𝐨𝐫𝐦𝐞 𝐩𝐨𝐮𝐫 𝐚𝐜𝐜𝐞́𝐝𝐞𝐫 𝐚𝐮𝐱 𝐜𝐨𝐧𝐭𝐞𝐧𝐮𝐬 𝐞𝐱𝐜𝐥𝐮𝐬𝐢𝐟𝐬.
        </p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-16 items-start justify-items-center">
      
      <div class="flex flex-col items-center">
        <div class="perspective-container">
            <div class="smartphone-container tilt-left">
                <div class="img-wrapper">
                    <img src="images/s26profilv.png" class="phone-img phone-img-profil">
                    <img src="images/s26facev.png" class="phone-img phone-img-face">
                </div>
                <div class="phone-overlay">
                    <img src="images/android.png" class="w-16 h-16 object-contain">
                    <div class="text-center px-2">
                        <h3 class="text-xl font-bold uppercase">𝐀𝐧𝐝𝐫𝐨𝐢𝐝</h3>
                        <span class="text-2xl neon-blue">APK</span>
                        <p class="text-white text-xs mt-2 leading-tight">𝐀𝐜𝐜𝐞́𝐝𝐞𝐳 𝐚𝐮 𝐜𝐚𝐭𝐚𝐥𝐨𝐠𝐮𝐞 𝐝'𝐚𝐩𝐩𝐥𝐢𝐜𝐚𝐭𝐢𝐨𝐧𝐬 𝐀𝐧𝐝𝐫𝐨𝐢𝐝.</p>
                    </div>
                    <a href="android.html" class="btn-download">VOIR TOUT</a>
                </div>
            </div>
        </div>
      </div>

      <div class="flex flex-col items-center">
        <div class="perspective-container">
            <div class="smartphone-container tilt-right">
                <div class="img-wrapper">
                    <img src="images/phone17profilv.png" class="phone-img phone-img-profil">
                    <img src="images/phone17facev.png" class="phone-img phone-img-face">
                </div>
                <div class="phone-overlay">
                    <img src="images/apple.png" class="w-16 h-16 object-contain">
                    <div class="text-center px-2">
                        <h3 class="text-xl font-bold uppercase">𝐈𝐨𝐬</h3>
                        <span class="text-2xl neon-blue">IPA</span>
                        <p class="text-white text-xs mt-2 leading-tight">𝐀𝐜𝐜𝐞́𝐝𝐞𝐳 𝐚𝐮 𝐜𝐚𝐭𝐚𝐥𝐨𝐠𝐮𝐞 𝐝'𝐚𝐩𝐩𝐥𝐢𝐜𝐚𝐭𝐢𝐨𝐧𝐬 𝐈𝐎𝐒.</p>
                    </div>
                    <a href="ios.html" class="btn-download">VOIR TOUT</a>
                </div>
            </div>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>
    particlesJS('particles-js', {
      "particles": {
        "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
        "color": { "value": "#00d2ff" },
        "shape": { "type": "circle" },
        "opacity": { "value": 0.9, "random": true, "anim": { "enable": true, "speed": 1, "opacity_min": 0.1, "sync": false } },
        "size": { "value": 4, "random": true, "anim": { "enable": true, "speed": 2, "size_min": 0.1, "sync": false } },
        "line_linked": { "enable": true, "distance": 150, "color": "#00d2ff", "opacity": 0.4, "width": 1 },
        "move": { "enable": true, "speed": 2, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
      },
      "interactivity": {
        "detect_on": "canvas",
        "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" }, "resize": true }
      },
      "retina_detect": true
    });
  </script>
</body>
</html>
