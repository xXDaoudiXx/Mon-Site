<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>xXDaoudiXx - PC Download Zone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
        margin: 0;
        color: white;
        font-family: 'Segoe UI', sans-serif;
        background-color: #050505; 
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
    }

    #bg-wrapper {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: -1;
        background: linear-gradient(rgba(0, 0, 0, 0.10), rgba(0, 0, 0, 0.95)), 
                    url('images/background.jpg') center center / cover no-repeat;
    }

    #particles-js {
        position: absolute;
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 8px #00d2ff);
    }

    .neon-blue {
      color: #fff;
      text-shadow: 0 0 5px #fff, 0 0 15px #00d2ff, 0 0 30px rgba(0, 210, 255, 0.6);
      font-style: italic;
      font-weight: 900;
      text-transform: uppercase;
    }

    /* Style des boutons de navigation avec effet néon */
    .back-btn {
        background: #050505;
        border: 1px solid #444;
        padding: 8px 20px;
        border-radius: 50px;
        font-weight: bold;
        transition: 0.3s all ease-in-out;
        color: white;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
    }

    .back-btn:hover {
        color: #fff;
        border-color: #00d2ff;
        text-shadow: 0 0 5px #fff, 0 0 10px #00d2ff, 0 0 20px #00d2ff;
        box-shadow: 0 0 5px #fff, 0 0 15px #00d2ff, 0 0 30px rgba(0, 210, 255, 0.6);
    }

    /* --- NOUVEAU CONTENEUR PC (FIXE) --- */
    .static-pc-card {
        position: relative;
        width: 100%;
        max-width: 600px; /* Plus large pour un PC */
        margin: 0 auto 40px auto;
        /* Ajout de la lueur de base sur le PC */
        filter: drop-shadow(0 10px 20px rgba(0,210,255,0.3));
        transition: filter 0.3s ease;
    }

    .static-pc-card:hover {
        /* Plus de lueur au survol */
        filter: drop-shadow(0 10px 30px rgba(0,210,255,0.5));
    }

    .pc-img-wrapper {
        width: 100%;
        display: block;
        position: relative;
    }

    .pc-base-img {
        width: 100%;
        height: auto;
        display: block;
    }

    /* --- OVERLAY SUR L'ÉCRAN DU PC --- */
    .pc-screen-overlay {
        position: absolute;
        /* Ajustements précis pour s'adapter à l'écran du PC de ton image */
        top: 6.5%; /* Haut de l'écran */
        left: 5.5%; /* Bord gauche de l'écran */
        width: 89%; /* Largeur de l'écran */
        height: 70%; /* Hauteur de l'écran affichée */
        
        /* Disposition verticale */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start; /* Aligner en haut */
        
        z-index: 10;
        padding: 10px;
        /* Pour voir l'overlay pendant le développement : border: 1px solid red; */
    }

    /* Position de l'icône de l'appli en haut de l'écran */
    .app-icon-top {
        width: 100px;
        height: 100px;
        object-contain: true;
        margin-top: 10px; /* Espace en haut */
        margin-bottom: 5px;
    }

    /* Texte centré sur l'écran */
    .app-text-center {
        text-align: center;
        padding: 0 5px;
        flex-grow: 1; /* Prend l'espace pour pousser le bouton vers le bas */
        display: flex;
        flex-direction: column;
        justify-content: center; /* Centre le texte verticalement dans cet espace */
    }

    /* --- LE BOUTON TÉLÉCHARGER INTÉGRÉ --- */
    /* On l'intègre en bas de l'overlay de l'écran */
    .btn-pc-download {
        /* Recréer le style du bouton de ton image */
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(5px);
        border: 2px solid #ccc;
        border-radius: 8px;
        padding: 8px 24px;
        
        color: white;
        font-weight: 700;
        font-size: 0.85rem;
        text-transform: uppercase;
        
        transition: 0.3s all ease-in-out;
        margin-bottom: 25px; /* Espace en bas de l'écran */
    }

    .btn-pc-download:hover {
        /* Effet néon bleu sur le bouton au survol */
        border-color: #00d2ff; 
        box-shadow: 0 0 15px #00d2ff; 
        color: #00d2ff;
        text-shadow: 0 0 5px #00d2ff;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

                    <p class="text-[15px] text-gray-200 mt-1">𝐈𝐒𝐎 𝐩𝐫𝐞̂𝐭 𝐚 𝐞𝐭𝐫𝐞 𝐛𝐨𝐨𝐭𝐞́</p>
                </div>

      </div> 
  </main>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>
    particlesJS('particles-js', {
      "particles": {
        "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
        "color": { "value": "#00d2ff" },
        "opacity": { "value": 0.5 },
        "size": { "value": 3 },
        "line_linked": { "enable": true, "distance": 150, "color": "#00d2ff", "opacity": 0.4, "width": 1 },

  </script>
</body>
</html>
