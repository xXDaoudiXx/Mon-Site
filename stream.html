<!DOCTYPE html>
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>xXDaoudiXx - Fixed Layout Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
        margin: 0;
        color: white;
        font-family: 'Segoe UI', sans-serif;
        background-color: #030303; 
        overflow-x: hidden;
    }

    /* --- FOND --- */
    #bg-wrapper {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: -1;
        background: linear-gradient(rgba(0, 0, 0, 0.20), rgba(0, 0, 0, 0.98)), 
                    url('background.jpg') center center / cover no-repeat;
    }

    #particles-js {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.9));
        opacity: 0.9;
    }

    .neon-blue-text {
      color: #fff;
      text-shadow: 0 0 5px #fff, 0 0 15px #00d2ff, 0 0 30px rgba(0, 210, 255, 0.6);
      font-style: italic;
    }

    /* --- CARRÉS FIXES --- */
    .neon-card {
        background: #090909; 
        border: 1px solid rgba(255, 255, 255, 0.03);
        border-radius: 20px;
        transition: all 0.4s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between; 
        padding: 40px 20px;
        position: relative;
        min-height: 450px;
        width: 100%;
        max-width: 320px; /* Largeur fixe pour garder l'aspect carré/rectangulaire propre */
    }

    .neon-card:hover {
        border-color: #00d2ff;
        box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
        transform: translateY(-8px);
    }

    .btn-enter {
        background: #111111; 
        color: #ffffff;      
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 14px 20px;
        width: 90%;
        border-radius: 12px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 2px;
        transition: all 0.3s ease;
        text-align: center;
    }

    .btn-enter:hover {
        border-color: #00d2ff; 
        box-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen text-center">
  
  <div id="bg-wrapper">
      <div id="particles-js"></div>
  </div>

  <main class="flex flex-col flex-grow items-center justify-center p-6 relative z-10">
    <h1 class="text-5xl md:text-7xl font-black mb-4 neon-blue-text">Domaines Officiels URL</h1>
    <p class="text-gray-400 mb-12 tracking-[0.4em] uppercase text-[10px] font-bold">Liens Souvent mis A jour Bon Visionage !</p>

    <div class="flex flex-wrap justify-center gap-8 w-full max-w-6xl">
      
      <div class="neon-card">
          <h2 class="text-2xl font-black italic">Tv En Directe</h2>
          <img src="images/direct.png" alt="Android" class="w-[250px] h-[250px] object-contain">
          <a href="https://witv.team/" class="btn-enter">ENTRER</a>
      </div>

      <div class="neon-card">
          <h2 class="text-2xl font-black italic">Films Et Series</h2>
          <img src="images/series.png" alt="PC" class="w-[250px] h-[250px] object-contain">
          <a href="https://warflix.im/movie" class="btn-enter">ENTRER</a>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>
    particlesJS('particles-js', {
      "particles": {
        "number": {"value": 60, "density": {"enable": true, "value_area": 800}},
        "color": {"value": "#00d2ff"},
        "shape": {"type": "circle"},
        "opacity": {"value": 1},
        "size": {"value": 3.5, "random": true},
        "line_linked": {"enable": true, "distance": 150, "color": "#00d2ff", "opacity": 0.4},
        "move": {"enable": true, "speed": 1.2}
      }
    });
  </script>
</body>
</html>
