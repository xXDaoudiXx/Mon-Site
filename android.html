<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>xXDaoudiXx - Android Blue Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
        margin: 0;
        color: white;
        font-family: 'Segoe UI', sans-serif;
        background-color: #050505; 
        overflow-x: hidden;
    }

    #bg-wrapper {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: -1;
        background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.95)), 
                    url('Mon Image.png') center center / cover no-repeat;
    }

    #particles-js {
        width: 100%;
        height: 100%;
        opacity: 0.8;
    }

    .neon-title {
      color: #fff;
      text-shadow: 0 0 5px #fff, 0 0 15px #00d2ff, 0 0 30px rgba(0, 210, 255, 0.6);
      font-style: italic;
      font-weight: 900;
    }

    .rgb-card {
        position: relative;
        border-radius: 20px;
        padding: 2px;
        overflow: hidden;
        display: flex;
    }

    .rgb-card::before {
        content: "";
        position: absolute;
        top: -50%; left: -50%; width: 200%; height: 200%;
        background: conic-gradient(#ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000);
        animation: rotate 4s linear infinite;
        z-index: -1;
    }

    .card-inner {
        background: #050505; 
        border-radius: 18px;
        width: 100%;
        padding: 30px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 1;
    }

    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .btn-download {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 12px;
        width: 100%;
        border-radius: 10px;
        margin-top: 15px;
        font-weight: 900;
        text-transform: uppercase;
        transition: 0.3s;
        text-align: center;
    }

    .btn-download:hover {
        background: white;
        color: black;
        box-shadow: 0 0 15px white;
    }

    .back-btn {
        background: #050505;
        border: 1px solid #444;
        padding: 8px 20px;
        border-radius: 50px;
        font-weight: bold;
        transition: 0.3s;
    }

    .back-btn:hover { border-color: #00d2ff; box-shadow: 0 0 10px #00d2ff; }
  </style>
</head>
<body class="flex flex-col min-h-screen">
  <div id="bg-wrapper"><div id="particles-js"></div></div>
  <nav class="p-6 relative z-10 flex justify-between items-center max-w-6xl mx-auto w-full">
    <a href="index.html" class="back-btn">← ACCUEIL</a>
    <h1 class="text-2xl neon-title">xXDaoudiXx</h1>
  </nav>
  <main class="flex-grow p-6 relative z-10 max-w-6xl mx-auto w-full text-center">
    <header class="mb-16">
        <h2 class="text-5xl font-black italic uppercase">ZONE <span class="text-blue-400">ANDROID</span></h2>
    </header>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10">
      <div class="rgb-card">
        <div class="card-inner">
            <img src="images/ton_icone.png" class="w-16 h-16 object-contain mb-4" alt="App">
            <h3 class="text-xl font-bold italic">APPLICATION MOD</h3>
            <a href="#" class="btn-download">TÉLÉCHARGER</a>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>
    particlesJS('particles-js', {
      "particles": {
        "number": {"value": 50},
        "color": {"value": "#00d2ff"},
        "opacity": {"value": 0.8},
        "size": {"value": 3},
        "line_linked": {"enable": true, "distance": 150, "color": "#00d2ff", "opacity": 0.3},
        "move": {"enable": true, "speed": 1.5}
      }
    });
  </script>
</body>
</html>
