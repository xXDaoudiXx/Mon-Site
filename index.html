<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>xXDaoudiXx - Blue Particles Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
        margin: 0;
        color: white;
        font-family: 'Segoe UI', sans-serif;
        background-color: #050505; 
        overflow-x: hidden;
    }

    /* --- CONTENEUR DU FOND --- */
    #bg-wrapper {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: -1;
        background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)), 
                    url('Mon Image.png') center center / cover no-repeat;
    }

    /* --- ZONE DES PARTICULES --- */
    #particles-js {
        position: absolute;
        width: 100%;
        height: 100%;
    }

    /* --- TITRE BLEU NÉON --- */
    .neon-blue-text {
      color: #fff;
      text-shadow:
        0 0 5px #fff,
        0 0 15px #00d2ff,
        0 0 30px rgba(0, 210, 255, 0.6);
      font-style: italic;
    }

    /* --- CARRÉS (RGB CARD) --- */
    .rgb-card {
        position: relative;
        border-radius: 20px;
        padding: 2px;
        overflow: hidden;
        display: flex;
        width: 100%;
        max-width: 300px; /* Taille réduite */
        margin: 0 auto;
    }

    .rgb-card::before {
        content: "";
        position: absolute;
        top: -50%; left: -50%; width: 200%; height: 200%;
        background: conic-gradient(#ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000);
        animation: rotate 4s linear infinite;
        z-index: -1;
    }

    .card-inner {
        background: #0f0f0f; 
        border-radius: 18px;
        width: 100%;
        padding: 25px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* --- BOUTONS --- */
    .btn-enter {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 12px 15px;
        width: 85%;
        border-radius: 10px;
        margin-top: 20px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        transition: 0.3s;
        text-align: center;
        font-size: 0.9rem;
    }

    .btn-enter:hover {
        background: white;
        color: black;
        box-shadow: 0 0 20px rgba(255,255,255,0.4);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen text-center">
  
  <div id="bg-wrapper">
      <div id="particles-js"></div>
  </div>

  <main class="flex flex-col flex-grow items-center justify-center p-6 relative z-10">
    <h1 class="text-4xl md:text-6xl font-black mb-2 neon-blue-text">xXDaoudiXx</h1>
    <p class="text-gray-400 mb-10 tracking-[0.4em] uppercase text-[9px] font-bold">Logiciels Et Apk Gratuit</p>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-2xl">
      
      <div class="rgb-card">
        <div class="card-inner">
            <h2 class="text-2xl font-black mb-4 italic">ANDROID</h2>
            <img src="images/LD0006205706.png" alt="Android" class="w-[80px] h-[80px] object-contain mb-2">
            <a href="android.html" class="btn-enter">ENTRER</a>
        </div>
      </div>

      <div class="rgb-card">
        <div class="card-inner">
            <h2 class="text-2xl font-black mb-4 italic">WINDOWS</h2>
            <img src="images/Pc.png" alt="PC" class="w-[80px] h-[80px] object-contain mb-2">
            <a href="logiciels.html" class="btn-enter">ENTRER</a>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>
    particlesJS('particles-js', {
      "particles": {
        "number": {
          "value": 80, 
          "density": {"enable": true, "value_area": 800}
        },
        "color": {
          "value": "#00d2ff" /* COULEUR BLEU CIEL */
        },
        "shape": {
          "type": "circle"
        },
        "opacity": {
          "value": 0.7,
          "random": false
        },
        "size": {
          "value": 3,
          "random": true
        },
        "line_linked": {
          "enable": true,
          "distance": 150,
          "color": "#00d2ff", /* LIGNES BLEU CIEL */
          "opacity": 0.4,
          "width": 1
        },
        "move": {
          "enable": true,
          "speed": 2,
          "direction": "none",
          "random": false,
          "straight": false,
          "out_mode": "out",
          "bounce": false
        }
      },
      "interactivity": {
        "detect_on": "canvas",
        "events": {
          "onhover": { "enable": true, "mode": "grab" },
          "onclick": { "enable": true, "mode": "push" }
        }
      },
      "retina_detect": true
    });
  </script>
</body>
</html>
