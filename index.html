<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>xXDaoudiXx - Edition Compacte</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
        margin: 0;
        color: white;
        font-family: 'Segoe UI', sans-serif;
        background-color: #050505; 
        overflow-x: hidden;
    }

    /* --- FOND --- */
    #bg-wrapper {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: -1;
        background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)), 
                    url('Mon Image.png') center center / cover no-repeat;
    }

    #particles-js {
        width: 100%;
        height: 100%;
        opacity: 0.8;
    }

    /* --- NOUVELLE COULEUR DAOUDI (JAUNE NÉON) --- */
    .neon-text-custom {
      color: #fff;
      text-shadow:
        0 0 5px #fff,
        0 0 15px #ffea00, /* Couleur principale (Jaune) */
        0 0 30px rgba(255, 234, 0, 0.6);
      font-style: italic;
    }

    /* --- RECTANGLES PLUS PETITS --- */
    .rgb-card {
        position: relative;
        border-radius: 15px; /* Arrondi légèrement réduit */
        padding: 2px;
        overflow: hidden;
        display: flex;
        max-width: 320px; /* Limite la largeur des carrés */
        margin: 0 auto;   /* Centre les carrés */
    }

    .rgb-card::before {
        content: "";
        position: absolute;
        top: -50%; left: -50%; width: 200%; height: 200%;
        background: conic-gradient(#ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000);
        animation: rotate 4s linear infinite;
        z-index: -1;
    }

    .card-inner {
        background: #0f0f0f; 
        border-radius: 13px;
        width: 100%;
        padding: 25px 15px; /* Padding réduit pour un aspect plus compact */
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* --- BOUTONS PLUS FINS --- */
    .btn-enter {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 10px 15px;
        width: 85%;
        border-radius: 10px;
        margin-top: 15px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-size: 0.8rem;
        transition: 0.3s;
        text-align: center;
    }

    .btn-enter:hover {
        background: white;
        color: black;
        box-shadow: 0 0 15px rgba(255,255,255,0.4);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen text-center">
  
  <div id="bg-wrapper">
      <div id="particles-js"></div>
  </div>

  <main class="flex flex-col flex-grow items-center justify-center p-6 relative z-10">
    <h1 class="text-5xl md:text-7xl font-black mb-4 neon-text-custom">xXDaoudiXx</h1>
    <p class="text-gray-400 mb-8 tracking-[0.4em] uppercase text-[10px] font-bold">Logiciels Et Apk Gratuit</p>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-3xl">
      <div class="rgb-card">
        <div class="card-inner">
            <h2 class="text-2xl font-black mb-4 italic">SMARTPHONE</h2>
            <img src="s25Ultra.png" alt="Android" class="w-[80px] h-[80px] object-contain mb-3">
            <a href="android.html" class="btn-enter">ENTRER</a>
        </div>
      </div>

      <div class="rgb-card">
        <div class="card-inner">
            <h2 class="text-2xl font-black mb-4 italic">WINDOWS</h2>
            <img src="Pc.png" alt="PC" class="w-[80px] h-[80px] object-contain mb-3">
            <a href="logiciels.html" class="btn-enter">ENTRER</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>
    particlesJS('particles-js', {
      "particles": {
        "number": {"value": 50, "density": {"enable": true, "value_area": 800}},
        "color": {"value": "#00d2ff"},
        "shape": {"type": "circle"},
        "opacity": {"value": 0.6},
        "size": {"value": 3},
        "line_linked": {
            "enable": true, 
            "distance": 150, 
            "color": "#00d2ff", 
            "opacity": 0.3
        },
        "move": {"enable": true, "speed": 1.5}
      }
    });
  </script>
</body>
</html>
